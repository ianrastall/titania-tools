[workspace]
resolver = "3"
members = ["titania-pgn", "titania-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Ian Rastall"]

[workspace.dependencies]
memchr = "2"
memmap2 = "0.9"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding is required: the FFI layer catches panics instead of letting them cross into C#.
panic = "unwind"
